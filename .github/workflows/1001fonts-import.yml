name: Import Font from 1001fonts

# ─────────────────────────────────────────────────────────────────────────────
# Given a 1001fonts.com font page URL this workflow:
#   1. Scrapes: font name, author, gallery images (direct avif links), zip URL.
#   2. Creates a stub fonts row in Supabase (you must supply minimal metadata).
#   3. Enqueues the font with gallery images + zip URL for the main pipeline.
#
# The font-processing-pipeline will then download the zip, classify variants,
# and publish them automatically.
#
# REQUIRED SECRETS:
#   VITE_SUPABASE_URL          Supabase project URL
#   SUPABASE_SERVICE_ROLE_KEY  Supabase service-role key
#
# OPTIONAL SECRETS:
#   GEMINI_API_KEY             For Gemini AI classification in the pipeline
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      font_page_url:
        description: '1001fonts font page URL (e.g. https://www.1001fonts.com/diomeca-font.html)'
        required: true
        type: string
      uploader_user_id:
        description: 'Supabase user UUID to attribute the upload to (admin user ID)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: 1001fonts-import-${{ github.event.inputs.font_page_url }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape 1001fonts page
        id: scrape
        run: |
          python scripts/scrape-1001fonts.py "${{ github.event.inputs.font_page_url }}" \
            --output /tmp/scraped.json
          echo "Scraped result:"
          cat /tmp/scraped.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node dependencies
        run: npm ci

      - name: Create font row + queue entry in Supabase
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPE_RESULT_PATH: /tmp/scraped.json
          FONT_PAGE_URL: ${{ github.event.inputs.font_page_url }}
          UPLOADER_USER_ID: ${{ github.event.inputs.uploader_user_id }}
        run: node scripts/font-processing/create-from-1001fonts.js

      - name: Upload scrape result as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 1001fonts-scrape-${{ github.run_id }}
          path: /tmp/scraped.json
          retention-days: 7

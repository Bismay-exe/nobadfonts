name: Font Processing Core Tests

on:
  pull_request:
    paths:
      - 'scripts/font-processing/**'
      - 'scripts/process-ai-fonts.js'
      - '.github/workflows/process-ai-fonts.yml'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/font-processing-core-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/font-processing/**'
      - 'scripts/process-ai-fonts.js'
      - '.github/workflows/process-ai-fonts.yml'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/font-processing-core-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check production processor syntax
        run: node --check scripts/process-ai-fonts.js

      - name: Run isolated font-processing regression tests
        run: npm run test:font-processing

name: Font Processing Core Tests

on:
  pull_request:
    paths:
      - 'scripts/font-processing/**'
      - 'scripts/generate-sitemap.js'
      - 'src/**'
      - 'api/sitemap.ts'
      - 'supabase/migrations/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/font-processing-core-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/font-processing/**'
      - 'scripts/generate-sitemap.js'
      - 'src/**'
      - 'api/sitemap.ts'
      - 'supabase/migrations/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/font-processing-core-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Check publishing pipeline syntax
        run: node --check scripts/font-processing/publish-plan.js

      - name: Run isolated font-processing regression tests
        run: npm run test:font-processing

      - name: Type-check and build web application
        run: npm run build

  publishing-rpc-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run isolated atomic-publish SQL tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/font-processing-publish-rpc.integration.sql

  family-hierarchy-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Validate family hierarchy migration in disposable PostgreSQL
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/font-family-hierarchy-migration.integration.sql

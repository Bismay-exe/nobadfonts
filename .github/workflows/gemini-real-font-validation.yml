name: Gemini Real-Font Advisory Validation (Manual Only)

on:
  workflow_dispatch:
    inputs:
      confirm_live_gemini_request:
        description: "I approve one live Gemini API request reviewing 10 real font metadata candidates"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  real-font-advisory-validation:
    if: inputs.confirm_live_gemini_request == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate curated real-font fixture
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const input = JSON.parse(fs.readFileSync('tests/fixtures/gemini-real-font-candidates.json', 'utf8'));
          if (!Array.isArray(input) || input.length !== 10) {
            throw new Error(`Expected exactly 10 real-font candidates; got ${input?.length ?? 'non-array'}`);
          }
          const ids = input.map((candidate) => candidate.asset_id);
          if (ids.some((id) => !/^[a-f0-9]{64}$/.test(id)) || new Set(ids).size !== ids.length) {
            throw new Error('Fixture candidate IDs must be unique SHA-256 hashes.');
          }
          if (input.some((candidate) => !candidate.relative_path || !candidate.metadata?.family_name
            || !candidate.metadata?.subfamily_name || !['parsed', 'unknown'].includes(candidate.metadata?.status))) {
            throw new Error('Fixture candidates must include parsed family/subfamily metadata.');
          }
          console.log(JSON.stringify({
            candidate_count: input.length,
            formats: [...new Set(input.map((candidate) => candidate.extension))].sort(),
            includes_variable_fonts: input.some((candidate) => candidate.metadata.is_variable === true),
            includes_cross_format_weight_conflict: input.some((candidate) => candidate.metadata.family_name === 'Monaspace Krypton NF' && candidate.metadata.weight_class === 400)
              && input.some((candidate) => candidate.metadata.family_name === 'Monaspace Krypton NF' && candidate.metadata.weight_class === 700),
          }, null, 2));
          NODE

      - name: Confirm Gemini secret is configured (never print it)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is not configured for this repository/workflow."
            exit 1
          fi
          echo "Gemini key is configured."

      - name: Run one budget-limited real-font advisory request
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MAX_REQUESTS: "1"
          GEMINI_MAX_OUTPUT_TOKENS: "2048"
          GEMINI_MAX_TOTAL_OUTPUT_TOKENS: "2048"
          GEMINI_REVIEW_CACHE_FILE: validation-output/gemini-review-cache.json
        run: |
          mkdir -p validation-output
          node scripts/font-processing/run-gemini-review.js \
            tests/fixtures/gemini-real-font-candidates.json \
            validation-output/gemini-real-font-review.json

      - name: Validate complete, read-only advisory response
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const input = JSON.parse(fs.readFileSync('tests/fixtures/gemini-real-font-candidates.json', 'utf8'));
          const output = JSON.parse(fs.readFileSync('validation-output/gemini-real-font-review.json', 'utf8'));
          const expected = new Set(input.map((candidate) => candidate.asset_id));
          const decisions = output.decisions || [];
          const actual = decisions.map((decision) => decision.candidate_id);
          if (output.model !== 'gemini-3.8-flash') throw new Error(`Unexpected model: ${output.model}`);
          if (decisions.length !== expected.size || new Set(actual).size !== expected.size
            || actual.some((id) => !expected.has(id))) {
            throw new Error(`Expected exactly one decision for each of 10 candidates; got ${decisions.length}`);
          }
          if ((output.missing_candidate_ids || []).length !== 0) throw new Error('Gemini omitted one or more candidates.');
          if (output.publishable !== false || output.database_writes_performed !== false || output.uploads_performed !== false) {
            throw new Error('Advisory output violated the read-only safety contract.');
          }
          console.log(JSON.stringify({
            status: 'validated',
            model: output.model,
            candidate_count: input.length,
            decision_count: decisions.length,
            decision_summary: decisions.reduce((summary, decision) => {
              summary[decision.decision] = (summary[decision.decision] || 0) + 1;
              return summary;
            }, {}),
            missing_candidate_ids: output.missing_candidate_ids,
            publishable: output.publishable,
            database_writes_performed: output.database_writes_performed,
            uploads_performed: output.uploads_performed,
            usage_metadata: output.usage_metadata,
          }, null, 2));
          NODE

      - name: Upload advisory result (no secrets or font binaries)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-real-font-advisory-validation
          path: |
            tests/fixtures/gemini-real-font-candidates.json
            validation-output/gemini-real-font-review.json
          if-no-files-found: warn
          retention-days: 7

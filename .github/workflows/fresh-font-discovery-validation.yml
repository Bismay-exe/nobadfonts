name: Fresh Font Metadata Validation (Read Only)

on:
  pull_request:
    paths:
      - 'scripts/font-processing/replay-woff2-discovery.js'
      - 'scripts/font-processing/merge-woff2-replay.js'
      - 'scripts/font-processing/compare-discovery-summaries.js'
      - 'scripts/font-processing/validate-discovery-report.js'
      - 'scripts/font-processing/core.js'
      - 'scripts/font-processing/export-ambiguous-assets.js'
      - 'scripts/font-processing/parse-woff2-metadata.py'
      - '.github/workflows/fresh-font-discovery-validation.yml'
      - 'tests/font-processing-report.test.js'
  workflow_dispatch:
    inputs:
      baseline_artifact_id:
        description: "GitHub Actions artifact ID for the saved discovery report"
        required: true
        type: string
        default: "11608622180"

permissions:
  contents: read
  actions: read

jobs:
  replay-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install local font metadata parser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip python3-pip
          python3 -m pip install --break-system-packages fonttools brotli

      - name: Download saved discovery artifact using GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASELINE_ARTIFACT_ID: ${{ inputs.baseline_artifact_id || '11608622180' }}
        run: |
          mkdir -p validation-output/baseline
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$BASELINE_ARTIFACT_ID/zip" \
            --output validation-output/baseline/report.zip
          unzip -q validation-output/baseline/report.zip -d validation-output/baseline
          find validation-output/baseline -maxdepth 3 -type f -print

      - name: Replay saved report against original font archives (all formats, read only)
        run: |
          mkdir -p validation-output/results
          baseline="$(find validation-output/baseline -type f -name '*.json' -print -quit)"
          test -n "$baseline"
          node scripts/font-processing/replay-woff2-discovery.js "$baseline" validation-output/results/woff2-replay.json
          node scripts/font-processing/validate-discovery-report.js "$baseline" validation-output/results/baseline-summary.json
          node scripts/font-processing/merge-woff2-replay.js "$baseline" validation-output/results/woff2-replay.json validation-output/results/merged-report.json validation-output/results/merge-summary.json
          node scripts/font-processing/validate-discovery-report.js validation-output/results/merged-report.json validation-output/results/fresh-summary.json
          node scripts/font-processing/compare-discovery-summaries.js validation-output/results/baseline-summary.json validation-output/results/fresh-summary.json validation-output/results/grouping-comparison.json
          cat validation-output/results/merge-summary.json
          cat validation-output/results/grouping-comparison.json

      - name: Export unresolved candidates for bounded Gemini review (no API calls)
        run: |
          node scripts/font-processing/export-ambiguous-assets.js validation-output/results/merged-report.json validation-output/gemini-review-input
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const m = JSON.parse(fs.readFileSync('validation-output/gemini-review-input/manifest.json', 'utf8'));
          console.log(JSON.stringify({
            mode: m.mode,
            api_calls_performed: m.api_calls_performed,
            database_writes_performed: m.database_writes_performed,
            uploads_performed: m.uploads_performed,
            output_files: m.output_files,
            queues: m.queue_items.map((q) => ({
              slug: q.slug,
              candidate_count: q.candidate_count,
              reason_counts: q.reason_counts,
              batches: q.batch_files.length,
            })),
          }, null, 2));
          NODE

      - name: Upload all-format font metadata replay results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-font-discovery-validation
          path: validation-output/
          if-no-files-found: warn
          retention-days: 14

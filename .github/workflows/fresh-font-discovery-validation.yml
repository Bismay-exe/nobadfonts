name: Fresh Font Discovery Validation (Read Only)

on:
  workflow_dispatch:
    inputs:
      baseline_run_id:
        description: "GitHub Actions run ID containing the saved discovery report"
        required: true
        type: string
        default: "37914579536"

permissions:
  contents: read
  actions: read

jobs:
  replay-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install local WOFF2 parser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip python3-pip
          python3 -m pip install --break-system-packages fonttools brotli

      - name: Download saved discovery report
        uses: actions/download-artifact@v4
        with:
          name: font-asset-discovery-report
          repository: ${{ github.repository }}
          run-id: ${{ inputs.baseline_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: validation-output/baseline

      - name: Replay saved report against original font archives (read only)
        run: |
          mkdir -p validation-output/results
          baseline="$(find validation-output/baseline -type f -name '*.json' -print -quit)"
          test -n "$baseline"
          node scripts/font-processing/replay-woff2-discovery.js "$baseline" validation-output/results/woff2-replay.json

      - name: Upload WOFF2 replay results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-font-discovery-validation
          path: validation-output/
          if-no-files-found: warn
          retention-days: 14

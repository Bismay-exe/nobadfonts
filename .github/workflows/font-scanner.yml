name: Font Scanner Worker

on:
  # Run every 6 hours
  schedule:
    - cron: '0 */6 * * *'
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of repos to scan per run'
        required: false
        default: '20'
      dry_run:
        description: 'Dry run (no writes to Supabase)'
        type: boolean
        required: false
        default: false

jobs:
  scan-fonts:
    name: Scan Font Repositories
    runs-on: ubuntu-latest
    timeout-minutes: 55    # Stay well within 60min GHA limit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/font-scanner/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r scripts/font-scanner/requirements.txt
        working-directory: .

      - name: Validate environment
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_INGEST_KEY: ${{ secrets.SUPABASE_INGEST_KEY }}
          GITHUB_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "❌ SUPABASE_URL secret is not set"
            exit 1
          fi
          if [ -z "$SUPABASE_INGEST_KEY" ]; then
            echo "❌ SUPABASE_INGEST_KEY secret is not set"
            exit 1
          fi
          echo "✅ Environment validated"

      - name: Run font scanner
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_INGEST_KEY: ${{ secrets.SUPABASE_INGEST_KEY }}
          GITHUB_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
          WORKER_ID:           ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          BATCH_SIZE="${{ github.event.inputs.batch_size || '20' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"

          EXTRA_ARGS=""
          if [ "$DRY_RUN" = "true" ]; then
            EXTRA_ARGS="--dry-run"
            echo "ℹ️  Running in DRY RUN mode — no writes to Supabase"
          fi

          echo "🔍 Starting font scanner (batch_size=$BATCH_SIZE)"
          python scripts/font-scanner/scanner.py \
            --batch-size "$BATCH_SIZE" \
            $EXTRA_ARGS
        # Exit code 0 = all jobs succeeded, 1 = some jobs failed
        # We use continue-on-error false so GHA marks the run as failed
        # when there are persistent job failures (visible in the dashboard)
        continue-on-error: false

      - name: Upload scan logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-logs-${{ github.run_id }}
          path: /tmp/scanner-*.log
          if-no-files-found: ignore
          retention-days: 7
